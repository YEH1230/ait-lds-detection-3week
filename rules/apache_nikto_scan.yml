title: Apache Nikto Scanner Activity
id: 4b5eb396-4a7a-47f5-8bf8-75e3c4aec0ad
status: experimental
description: Detects explicit Nikto scanner user agents and the distinctive malformed empty-agent requests observed in AIT-LDS v1.0.
author: Agentic SOC Detection Team
date: 2026-08-21
references:
    - https://zenodo.org/records/3723083
logsource:
    category: webserver
    product: apache
    service: access
detection:
    selection_nikto_agent:
        user_agent.original|contains: 'Nikto/'
    selection_malformed_response:
        http.response.status_code: 400
    selection_malformed_agent:
        user_agent.original: '-'
    condition: selection_nikto_agent or (selection_malformed_response and selection_malformed_agent)
fields:
    - source.ip
    - http.request.method
    - url.original
    - http.response.status_code
falsepositives:
    - Authorized vulnerability scanning with Nikto
    - Broken clients that omit User-Agent and receive HTTP 400 responses
level: medium
tags:
    - attack.reconnaissance
    - attack.t1595
x_aitlds_labels:
    - nikto
